<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pokémon Scatter & Top 10 Sold</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <div class="main-container">
    <!-- Filters on the left -->
    <div class="filters">
      <h3 class="filters-header">Filters</h3>
      <div class="filter-group">
        <h4>Year <input type="checkbox" class="select-all" data-target="year-filters"> Select All</h4>
        <div id="year-filters"></div>
      </div>
      <div class="filter-group">
        <h4>Serie <input type="checkbox" class="select-all" data-target="serie-filters"> Select All</h4>
        <div id="serie-filters"></div>
      </div>
      <div class="filter-group">
        <h4>Set <input type="checkbox" class="select-all" data-target="set-filters"> Select All</h4>
        <div id="set-filters"></div>
      </div>
      <div class="filter-group">
        <h4>Type <input type="checkbox" class="select-all" data-target="type-filters"> Select All</h4>
        <div id="type-filters"></div>
      </div>
    </div>

    <!-- Charts on the right -->
    <div class="charts-section">
      <h2 class="title">Pokémon Price Evolution</h2>

      <div class="charts">
        <!-- Top row -->
        <div class="top-row">
          <div class="ScatterPlot"></div>
          <div class="BarChart"></div>
        </div>

        <!-- Bottom row -->
        <div class="bottom-row">
          <!-- SlopeGraph with vertical slider -->
          <div class="SlopeGraph-container">
            <div class="SlopeGraph"></div>

            <div class="slider-wrapper">
              <button class="slider-btn plus">+</button>
              <input type="range" min="0" max="2" step="0.03" value="0"
                    class="slider" id="slopeZoom">
              <button class="slider-btn minus">-</button>
            </div>
          </div>

          <!-- BoxPlot -->
          <div class="BoxPlot"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <script src="Idioms/type_colors.js"></script>
  <script src="Idioms/barchart.js"></script>
  <script src="Idioms/scatterplot.js"></script>
  <script src="Idioms/slopegraph.js"></script>
  <script src="Idioms/boxplot.js"></script>
  <script src="script.js"></script>
</body>
</html>
