<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pokémon Scatter & Top 10 Sold</title>
  <link rel="icon" type="image/ico" href="images/Pokeball.png">
  <link rel="stylesheet" href="style.css">
  <script src="d3/d3.min.js"></script>
</head>
<body>
  <div id="loading-overlay">
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <span id="progress-text">Loading charts...</span>
  </div>


  <div class="main-container">
    <!-- Filters on the left -->
    <div class="filters">
      <h3 class="filters-header">
        Filters
        <span class="info-icon" title="More information"></span>
          <img src="images/info.png" alt="Info" style="height:1em; width:auto; vertical-align:middle;">
        </span>
      </h3>
      <div class="filter-group tall-filters">
        <h4>
          Year <span class="filter-count">(0)</span>
          <span class="select-all-wrapper">
            Select All <input type="checkbox" class="select-all" data-target="year-filters">
          </span>
        </h4>
        <div id="year-filters"></div>
      </div>

      <div class="filter-group">
        <h4>
          Series <span class="filter-count">(0)</span>
          <span class="select-all-wrapper">
            Select All <input type="checkbox" class="select-all" data-target="serie-filters">
          </span>
        </h4>
        <div id="serie-filters"></div>
      </div>

      <div class="filter-group tall-filters">
        <h4>
          Set <span class="filter-count">(0)</span>
          <span class="select-all-wrapper">
            Select All <input type="checkbox" class="select-all" data-target="set-filters">
          </span>
        </h4>
        <input type="text" class="filter-search" placeholder="Search sets...">
        <div id="set-filters"></div>
      </div>

      <div class="filter-group tall-filters">
        <h4>
          Type <span class="filter-count">(0)</span>
          <span class="select-all-wrapper">
            Select All <input type="checkbox" class="select-all" data-target="type-filters">
          </span>
        </h4>
        <input type="text" class="filter-search" placeholder="Search types...">
        <div id="type-filters"></div>
      </div>

    </div>

    <!-- Charts on the right -->
    <div class="charts-section">
      <h2 class="title">Pokémon Price Evolution</h2>

      <div class="charts">
        <!-- Top row -->
        <div class="top-row">
          <div class="ScatterPlot"></div>
          <div class="BarChart"></div>
        </div>

        <!-- Bottom row -->
        <div class="bottom-row">
          <!-- LineChart with vertical slider -->
          <div class="LineChart-container">
            <div class="LineChart"></div>

            <div class="slider-container">
              <span class="slider-label">Zoom</span>
              <button class="slider-btn plus">+</button>
              <div class="slider-wrapper">
                <input id="slopeZoom" class="slider" type="range" min="0" max="3" step="0.1" value="1">
              </div>
              <button class="slider-btn minus">−</button>
            </div>
          </div>

          <!-- ViolinPlot -->
          <div class="ViolinPlot"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <script src="Idioms/type_colors.js"></script>
  <script src="Idioms/barchart.js"></script>
  <script src="Idioms/scatterplot.js"></script>
  <script src="Idioms/LineChart.js"></script>
  <script src="Idioms/ViolinPlot.js"></script>
  <script src="script.js"></script>
</body>
</html>
